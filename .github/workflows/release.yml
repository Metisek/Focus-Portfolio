# Plugin release: pushing a "vX.Y" tag (e.g. git tag v1.2 && git push origin v1.2)
# builds focus-portfolio-X.Y.zip (without the files listed in .distignore) and publishes it as a GitHub release.
# Sites with the plugin installed then see it under Plugins → "Update available".
# The release notes (shown in WordPress under "View details") are the CHANGELOG.md section for that version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version number
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K\S+' focus-portfolio.php)
          CONST=$(grep -m1 -oP "define\( 'FP_VERSION', '\K[^']+" focus-portfolio.php)
          echo "tag: $TAG, Version: $HEADER, FP_VERSION: $CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Tag v$TAG does not match the version in focus-portfolio.php (Version: $HEADER, FP_VERSION: $CONST)"
            exit 1
          fi

      - name: Build package
        run: |
          ZIP="focus-portfolio-${GITHUB_REF_NAME#v}.zip"
          mkdir -p build/focus-portfolio
          rsync -a --exclude-from=.distignore ./ build/focus-portfolio/
          (cd build && zip -qr "../$ZIP" focus-portfolio)
          unzip -l "$ZIP" | tail -1

      - name: Release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" 'f && /^## / {exit} f {print} index($0, "## " v " ") == 1 || $0 == "## " v {f=1}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Focus Portfolio $V" > notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: focus-portfolio-*.zip
          body_path: notes.md
